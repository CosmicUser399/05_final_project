[project]
name = "ai-reliability-modelling"
version = "0.1.0"
description = "AI Reliability Modelling: RAM simulation backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "alembic>=1.20.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.18.1.1",
    "greenlet>=3.5.6",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "D", "S", "T20"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"alembic/**" = ["D", "I001", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not slow\""
markers = [
    "slow: long-running performance checks",
]
