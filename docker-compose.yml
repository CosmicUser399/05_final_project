name: ai-reliability-modelling

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////srv/data/app.db}
  PETRI_PILOT_MCP_URL: ${PETRI_PILOT_MCP_URL:-http://petri-pilot:8080/mcp}

services:
  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${APP_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080}
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/srv/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Stub until the job queue lands in phase P5.
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/srv/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Local Petri-Pilot container. Enabled with: --profile petri.
  # Transport: MCP Streamable HTTP on /mcp (see docs/architecture/petri-pilot.md).
  petri-pilot:
    profiles: ["petri"]
    image: ${PETRI_PILOT_IMAGE:-ghcr.io/pflow-xyz/petri-pilot:latest}
    expose:
      - "8080"
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Default allows compose file parse without profile "postgres".
      # Override in .env for real use (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    profiles: ["queue"]
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
